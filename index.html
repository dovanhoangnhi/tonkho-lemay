<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Theo dõi tồn kho Lê Mây</title>
  <meta name="description" content="Theo dõi tồn kho và tạo ảnh bảng tồn gửi khách hàng - Lê Mây Co., Ltd">
  <meta name="theme-color" content="#c2457f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tồn kho Lê Mây">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <img class="topbar-logo" src="icons/lotus.png" alt="Lê Mây">
    <div class="topbar-title">
      <strong>Theo dõi tồn kho Lê Mây</strong>
      <span id="dataInfo">Chưa có dữ liệu</span>
    </div>
    <div id="headerActions"></div>
    <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" hidden>
  </header>

  <div id="banner" class="banner" hidden></div>

  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="stock" role="tab">Tồn kho</button>
    <button class="tab" data-tab="clear" role="tab">Hàng clear <span id="clearCount" class="count"></span></button>
    <button class="tab" data-tab="settings" role="tab">Cài đặt</button>
  </nav>

  <main id="main"></main>

  <div id="actionbar" class="actionbar" hidden>
    <span id="selInfo">Đã chọn 0 mã</span>
    <button class="btn btn-primary" data-action="make-image">Tạo ảnh gửi khách</button>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <strong>Ảnh gửi khách</strong>
        <button class="btn btn-ghost" data-action="close-modal" aria-label="Đóng">✕</button>
      </div>
      <label class="field">
        <span>Tên khách hàng (không bắt buộc)</span>
        <input id="customerName" type="text" placeholder="VD: Nhà thuốc Minh Châu" autocomplete="off">
      </label>
      <div id="imgList" class="img-list"></div>
    </div>
  </div>

  <div id="loginModal" class="modal" hidden>
    <form id="loginForm" class="modal-box login-box" autocomplete="on">
      <div class="modal-head">
        <strong>Đăng nhập</strong>
        <button type="button" class="btn btn-ghost" data-action="close-login" aria-label="Đóng">✕</button>
      </div>
      <label class="field">
        <span>Tên đăng nhập</span>
        <input id="loginUser" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span>Mật khẩu</span>
        <input id="loginPass" name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="loginError" class="login-error"></p>
      <button type="submit" class="btn btn-primary">Đăng nhập</button>
    </form>
  </div>

  <div id="dropzone" class="dropzone" hidden>Thả file CRM vào đây</div>
  <div id="toast" class="toast" hidden></div>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="config.js"></script>
  <script src="nguon-du-lieu.js"></script>
  <script src="logo-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
